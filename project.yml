name: NoiseMonitor
options:
  bundleIdPrefix: com.pinapia
  deploymentTarget: { iOS: "17.0" }
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "NGM7GX8DGB"
    CODE_SIGN_STYLE: Automatic
targets:
  NoiseMonitor:
    type: application
    platform: iOS
    sources: [NoiseMonitor]
    info:
      path: NoiseMonitor/Info.plist
      properties:
        CFBundleDisplayName: 低频猎手
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: 需要用麦克风分析家里噪音的频率和强度。声音只在手机上实时分析，不会录音，也不会上传。
        UILaunchScreen: {}
        # 只用系统自带的加密（HTTPS 都没有），每次传包不用再回答出口合规问题
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pinapia.NoiseMonitor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
